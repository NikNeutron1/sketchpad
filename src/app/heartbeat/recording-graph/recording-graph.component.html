<div
  #containerRecording
  style="
    border: 1px solid white;
    height: 100px;
    margin-top: 100px;
    position: relative;
    width: 100%;
    box-sizing: border-box;
    overflow-x: hidden;
  "
  *ngIf="recording"
>
  <ng-container *ngFor="let waveSpike of waveSpikes">
    <div
      style="
        position: absolute;
        height: 10px;
        width: 10px;
        border-radius: 2px;
        background-color: orange;
        box-sizing: border-box;
      "
      [style.left]="waveSpike.timePercentage * 100 + '%'"
      [style.top]="waveSpike.top + 'px'"
    ></div>
  </ng-container>

  <div
    style="position: absolute; top: 0px; height: 50px; border: 1px solid white"
    [style.left]="getCurrenTimePercentage() * 100 + '%'"
  ></div>

  <div style="color: white; margin-top: 50px">
    {{ getTime().now }} / {{ getTime().dtRecording }}
  </div>
</div>
